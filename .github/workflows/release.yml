# Builds every release file on GitHub's own Windows runners, from this repository only:
# Nebo.Client.exe, the Stream Deck plugin, the three zips and NEBO-Setup-<version>.exe.
# The DCS server part is not in this repository and is not built here.
# Code signing (SignPath Foundation) needs exactly this: binaries built by a workflow on
# GitHub-hosted runners, so anyone can trace a signed file back to its source.
name: Release build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      # Files ship with the line endings they have in the repository (the runner's git would
      # turn LF into CRLF).
      - name: Keep line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tools (Pillow for the Stream Deck keys, Inno Setup 6 for the setup)
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE) { throw 'Inno Setup install failed' }

      - name: Build (client, tests)
        shell: powershell
        run: .\build.ps1 -NoDcs

      - name: Package (zips and setup)
        shell: powershell
        run: .\package.ps1

      # Plain ASCII with LF endings, so `sha256sum -c` reads it (Tee-Object would write UTF-16).
      - name: Checksums
        shell: powershell
        run: |
          $lines = Get-ChildItem release -File | Where-Object { $_.Name -match '^NEBO-.*\.(exe|zip)$' } |
            Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" }
          [IO.File]::WriteAllText("$PWD\release\SHA256SUMS.txt", (($lines -join "`n") + "`n"), [Text.Encoding]::ASCII)
          $lines

      - uses: actions/upload-artifact@v4
        with:
          name: nebo-release
          if-no-files-found: error
          path: |
            release/NEBO-Setup-*.exe
            release/NEBO-*.zip
            release/SHA256SUMS.txt
